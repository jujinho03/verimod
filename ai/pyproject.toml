[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verimod-ai"
version = "0.0.0"
description = "VeriMod AI / Data Science workspace (scaffold)."
readme = "README.md"
requires-python = ">=3.10"
# W3 CPU baseline: tested on Windows x64 / Python 3.12.14.
# Install requirements-w3.lock.txt first for the exact transitive versions
# and the explicit PyTorch CPU wheel source.
dependencies = [
    "torch==2.14.1+cpu",
    "transformers==4.57.6",
    "accelerate==1.15.0",
    "huggingface_hub==0.36.2",
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
